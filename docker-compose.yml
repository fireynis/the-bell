services:
  bell:
    build: .
    container_name: bell
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      bell-postgres:
        condition: service_healthy
      kratos:
        condition: service_healthy
      redis-bell:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://belluser:${POSTGRES_PASSWORD}@bell-postgres:5432/bell?sslmode=disable
      REDIS_URL: redis://redis-bell:6379
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      PORT: "8080"
      TOWN_NAME: "${TOWN_NAME:-My Town}"
      IMAGE_STORAGE_PATH: /storage/the-bell/images
      TRUST_SWEEP_INTERVAL: "${TRUST_SWEEP_INTERVAL:-24h}"
      BELL_ENV: "${BELL_ENV:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      REQUIRE_VERIFIED_EMAIL: "${REQUIRE_VERIFIED_EMAIL:-false}"
    volumes:
      - /storage/the-bell/images:/storage/the-bell/images
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bell.rule=Host(`bell.home.arpa`)"
      - "traefik.http.services.bell.loadbalancer.server.port=8080"
      - "traefik.http.routers.bell-secure.rule=Host(`bell.themacarthurs.ca`)"
      - "traefik.http.routers.bell-secure.entrypoints=websecure"
      - "traefik.http.routers.bell-secure.tls.certResolver=cloudflare"
      - "wud.watch.digest=true"
      - "homepage.group=Apps"
      - "homepage.name=The Bell"
      - "homepage.icon=bell.png"
      - "homepage.href=https://bell.themacarthurs.ca"
      - "homepage.description=Community micro-blog"

  # Runs `bell check-roles` on a fixed interval. Promotion to moderator and
  # demotion for sustained low trust only happen when this command runs, so
  # without a scheduler those rules are documented but never enforced.
  #
  # It also recomputes trust scores, which makes the interval the rate at which
  # moderation penalties decay and tenure accrues wherever Redis is absent — the
  # Redis-backed trust worker is otherwise the only thing that recalculates.
  # This stack has Redis (that worker sweeps every 24h), so here the refresh is
  # mostly belt-and-braces; on a Redis-less deployment it is the whole sweep.
  #
  # A sidecar rather than host cron so a fresh deployment gets it without any
  # host-level setup. If an in-process scheduler ever lands in the binary, delete
  # this service — two schedulers would double every promotion check.
  bell-check-roles:
    build: .
    container_name: bell-check-roles
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      bell:
        condition: service_healthy
    environment:
      # No REDIS_URL: check-roles builds its dependency graph without a Redis
      # client, so setting one would only suggest a cache that is never used.
      # The Kratos URLs are here because startup config validation requires
      # them, not because role checking calls Kratos.
      DATABASE_URL: postgres://belluser:${POSTGRES_PASSWORD}@bell-postgres:5432/bell?sslmode=disable
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      TOWN_NAME: "${TOWN_NAME:-My Town}"
      IMAGE_STORAGE_PATH: /storage/the-bell/images
    # `sleep` last, so the first pass runs at start rather than a day later. The
    # loop keeps going on failure: one bad run (say a brief DB blip) must not
    # silently end role checking until someone notices months later.
    # One list element, not a plain string: Compose word-splits a string command
    # into argv, which would hand `sh -c` only the first word as its script.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ./bell check-roles || echo "check-roles failed, retrying next cycle"
          sleep ${CHECK_ROLES_INTERVAL_SECONDS:-86400}
        done
    networks:
      - proxy

  bell-postgres:
    # Pinned: apache/age:latest floats across Postgres majors (it moved to PG18
    # and will move again), which would leave the server unable to start against
    # an existing data directory. Keep this identical to deploy/docker-compose.yml
    # and internal/testsupport so test and production cannot drift apart.
    image: apache/age:release_PG18_1.7.0
    container_name: bell-postgres
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belluser -d bell"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_USER: belluser
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: bell
    volumes:
      - /storage/the-bell/postgres:/var/lib/postgresql
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - proxy

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    container_name: kratos-migrate
    restart: "no"
    command: migrate sql -e --yes
    depends_on:
      bell-postgres:
        condition: service_healthy
    environment:
      DSN: postgres://belluser:${POSTGRES_PASSWORD}@bell-postgres:5432/bell_kratos?sslmode=disable
    networks:
      - proxy

  kratos:
    image: oryd/kratos:v1.3.1
    container_name: kratos
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4433/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    # --watch-courier runs the mail worker in-process. Without it Kratos queues
    # recovery and verification messages and never delivers them, which looks
    # exactly like a working flow until someone waits for an email.
    command: serve --config /etc/kratos/kratos.yml --watch-courier
    environment:
      DSN: postgres://belluser:${POSTGRES_PASSWORD}@bell-postgres:5432/bell_kratos?sslmode=disable
      # Mandatory, not defaulted: a missing cookie secret makes Kratos generate a
      # random one per boot (silently invalidating every session), and a shared
      # default would be a published key. Generate with:
      #   KRATOS_SECRETS_COOKIE  openssl rand -hex 32
      #   KRATOS_SECRETS_CIPHER  openssl rand -hex 16   (must be EXACTLY 32 chars)
      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE:?set KRATOS_SECRETS_COOKIE in .env - see .env.example}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER:?set KRATOS_SECRETS_CIPHER in .env, exactly 32 characters - see .env.example}
      # The default is a deliberately non-functional placeholder: Kratos rejects
      # an empty value outright, so there has to be something syntactically
      # valid here. Until a real relay is set, password recovery and email
      # verification fail at send time (logged by the courier worker).
      COURIER_SMTP_CONNECTION_URI: ${COURIER_SMTP_CONNECTION_URI:-smtp://localhost:1025/?disable_starttls=true}
      COURIER_SMTP_FROM_ADDRESS: ${COURIER_SMTP_FROM_ADDRESS:-noreply@bell.themacarthurs.ca}
      COURIER_SMTP_FROM_NAME: "${TOWN_NAME:-My Town}"
    volumes:
      - ./kratos/kratos.yml:/etc/kratos/kratos.yml:ro
      - ./kratos/identity.schema.json:/etc/kratos/identity.schema.json:ro
    networks:
      - proxy

  redis-bell:
    image: redis:7-alpine
    container_name: redis-bell
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - proxy

  # Mail catcher for TESTING email flows (recovery, verification) without a
  # real relay. Opt-in: set COMPOSE_PROFILES=mailtest in .env (or pass
  # --profile mailtest) and point the courier at it:
  #   COURIER_SMTP_CONNECTION_URI=smtp://mailhog:1025/?disable_starttls=true
  # Captured mail is browsable at http://<host>:8025 and holds live recovery
  # links for every account — never run this profile on a town with real
  # residents.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: bell-mailhog
    profiles: ["mailtest"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - proxy

networks:
  proxy:
    external: true
