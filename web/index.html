<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Inline data URI rather than a file: the bell is the whole identity, it is
      a few hundred bytes, and shipping it in the document means the tab is
      never briefly the wrong mark. Currency (#D4A017) is the accent token; a
      town that picks its own colours still gets this one in the tab, because a
      favicon cannot read runtime CSS variables.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D4A017' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9'/%3E%3Cpath d='M13.73 21a2 2 0 0 1-3.46 0'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Bell is a town's own noticeboard: neighbours post what is happening, and trust is earned by being vouched for by the people who already live here."
    />
    <!-- Matches --color-surface in each scheme, so the browser chrome joins the page. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101319" />
    <!-- Replaced at runtime with the town's own name; see useDocumentTitle. -->
    <title>The Bell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
