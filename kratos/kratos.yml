version: v1.3.1

dsn: memory

serve:
  public:
    base_url: https://bell.themacarthurs.ca/.ory
    cors:
      enabled: true
      allowed_origins:
        - https://bell.themacarthurs.ca
        - http://bell.home.arpa
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: https://bell.themacarthurs.ca/
  allowed_return_urls:
    - https://bell.themacarthurs.ca
    - http://bell.home.arpa

  methods:
    password:
      enabled: true
      config:
        min_password_length: 8

  flows:
    registration:
      enabled: true
      ui_url: https://bell.themacarthurs.ca/auth/registration
      after:
        password:
          hooks:
            - hook: session

    login:
      ui_url: https://bell.themacarthurs.ca/auth/login

    logout:
      after:
        default_browser_return_url: https://bell.themacarthurs.ca/

    settings:
      ui_url: https://bell.themacarthurs.ca/auth/settings

    recovery:
      enabled: true
      ui_url: https://bell.themacarthurs.ca/auth/recovery

    verification:
      enabled: true
      ui_url: https://bell.themacarthurs.ca/auth/verification

session:
  cookie:
    name: bell_session
    domain: bell.themacarthurs.ca
    same_site: Lax
  lifespan: 720h

cookies:
  domain: bell.themacarthurs.ca
  same_site: Lax

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/kratos/identity.schema.json

# secrets and courier.smtp.connection_uri are supplied by the environment
# (SECRETS_COOKIE, SECRETS_CIPHER, COURIER_SMTP_CONNECTION_URI) and are
# deliberately absent here. Anything written in this file is in the repository,
# and a cookie secret in the repository means anyone who can read it can forge a
# session for any account.
#
# Kratos does not complain when the secrets are missing: it silently generates a
# random cookie secret at boot, which logs every user out on every restart. That
# failure is invisible, so docker-compose.yml makes both variables mandatory
# rather than defaulting them.

log:
  level: info
  format: json
